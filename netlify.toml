# === Netlify Configuration File ===

# Build settings
[build]
  # If your site doesn't need a build step (just plain HTML/CSS/JS),
  # you can often omit the 'command'. If you have one, put it here.
  # command = "npm run build" # Example build command (uncomment if needed)

  # Directory (relative to the root) that contains the deploy-ready
  # HTML files and assets generated by the build command, or where
  # your static site files live if no build is needed.
  # For most simple static sites where index.html is in the root, this is "."
  publish = "."

  # Directory (relative to the root) where your serverless functions source code lives.
  functions = "netlify/functions"

# Redirect rule for cleaner API function calls
# This makes '/api/function-name' route internally to '/.netlify/functions/function-name'
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200 # Use 200 for a rewrite (internal handling)